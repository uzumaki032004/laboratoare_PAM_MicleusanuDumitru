name: Verificare laborator 3
on:
  push:
    branches: [main]
    paths: ['laborator_3/**', '.github/workflows/laborator-3.yml']
  pull_request:
    branches: [main]
    paths: ['laborator_3/**', '.github/workflows/laborator-3.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laborator_3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: learning-lab3-web
          path: laborator_3/build/web
      - run: flutter build apk --debug --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: learning-lab3-apk
          path: laborator_3/build/app/outputs/flutter-apk/app-*-debug.apk
